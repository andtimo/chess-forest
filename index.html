<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c9ecff">
<meta name="description" content="Шахматный лес: первая ступень к большим шахматам для детей от 2 лет.">
<meta property="og:title" content="Шахматный лес">
<meta property="og:description" content="Первая ступень к большим шахматам для детей от 2 лет.">
<meta property="og:type" content="website">
<title>Шахматный лес</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='44' y='76' width='12' height='18' rx='2' fill='%238a5a2b'/%3E%3Cpath d='M50 44l36 36H14z' fill='%23237032'/%3E%3Cpath d='M50 24l31 36H19z' fill='%232b8a3e'/%3E%3Cpath d='M50 6l26 34H24z' fill='%232f9e44'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Landing page (about the method) -->
<main id="intro" class="intro" hidden>
  <div class="intro-top">
    <div class="lang" role="group" data-t-aria="lang.label">
      <button type="button" data-lang="ru">RU</button><button type="button" data-lang="sk">SK</button><button type="button" data-lang="en">EN</button>
    </div>
  </div>
  <div class="intro-scroll" id="introScroll">
    <article class="intro-card">
      <div class="intro-hero">
        <h1 class="intro-title" data-t="intro.title"></h1>
        <p class="intro-sub" data-t="intro.subtitle"></p>
        <div class="sheet-wrap">
          <ul class="sheet" id="sheet" data-t-aria="intro.sheet"></ul>
          <p class="sheet-hint" id="sheetHint" role="status" hidden></p>
        </div>
      </div>
      <div class="intro-text">
        <p class="intro-lead" data-t="intro.lead"></p>
        <h2 class="intro-h" data-t="intro.h"></h2>
        <ul class="dev">
          <li><span class="dev-ico" data-art="brain"></span><p data-t-html="intro.p1.html"></p><ul class="pairs" id="pairs"></ul></li>
          <li><span class="dev-ico" data-art="board"></span><p data-t-html="intro.p2.html"></p></li>
          <li><span class="dev-ico" data-art="target"></span><p data-t-html="intro.p3.html"></p></li>
        </ul>
        <p class="maps" data-t="intro.maps"></p>
      </div>
    </article>
  </div>
  <div class="intro-bottom">
    <button type="button" class="btn btn-go" id="btnGo"><span class="go-ico" data-art="tree"></span><span data-t="intro.go"></span></button>
    <label class="skip"><input type="checkbox" id="skipIntro"><span data-t="intro.skip"></span></label>
  </div>
</main>

<main id="menu" class="menu" hidden>
  <div class="menu-corner">
    <button type="button" class="chip chip-icon" id="btnAboutMenu" data-t-aria="about"><span data-art="info"></span></button>
    <div class="lang" role="group" data-t-aria="lang.label">
      <button type="button" data-lang="ru">RU</button><button type="button" data-lang="sk">SK</button><button type="button" data-lang="en">EN</button>
    </div>
  </div>
  <div class="menu-card">
    <div class="menu-left">
      <h1 class="title" data-t="doc.title"></h1>
      <p class="subtitle" data-t="menu.subtitle"></p>
      <!-- Map choice: a tap on a card picks it (remembered on this device) -->
      <div class="map-pick" role="radiogroup" data-t-aria="menu.map">
        <button type="button" class="map-card" role="radio" aria-checked="true" data-map="1">
          <span class="map-pic" data-art="map1"></span>
          <span class="map-name" data-t="map.1"></span>
          <span class="map-age" data-t="map.1.age"></span>
        </button>
        <button type="button" class="map-card" role="radio" aria-checked="false" data-map="2">
          <span class="map-pic" data-art="map2"></span>
          <span class="map-name" data-t="map.2"></span>
          <span class="map-age" data-t="map.2.age"></span>
        </button>
      </div>
    </div>
    <div class="menu-buttons">
      <div class="timer-block">
        <span id="timerLabel" data-t="menu.timer"></span>
        <div class="seg seg-timer" role="radiogroup" aria-labelledby="timerLabel" aria-describedby="timerNote">
          <button type="button" role="radio" aria-checked="true" data-timer="0" data-t="menu.timer0"></button>
          <button type="button" role="radio" aria-checked="false" data-timer="30"><span class="t-long" data-t="menu.timer30"></span><span class="t-short" data-t="menu.timer30s"></span></button>
          <button type="button" role="radio" aria-checked="false" data-timer="15"><span class="t-long" data-t="menu.timer15"></span><span class="t-short" data-t="menu.timer15s"></span></button>
        </div>
        <p class="timer-note" id="timerNote" data-t="menu.timerNote0"></p>
      </div>
      <button type="button" class="btn btn-green" id="btnTwo" data-t="menu.two"></button>
      <div class="cpu-block">
        <button type="button" class="btn btn-orange" id="btnCpu" data-t="menu.cpu"></button>
        <div class="level">
          <span id="levelLabel" data-t="menu.level"></span>
          <div class="seg" role="radiogroup" aria-labelledby="levelLabel">
            <button type="button" role="radio" aria-checked="true" data-level="easy" data-t="menu.easy"></button>
            <button type="button" role="radio" aria-checked="false" data-level="smart" data-t="menu.smart"></button>
          </div>
        </div>
      </div>
      <button type="button" class="btn btn-ghost" id="btnRulesMenu" data-t="menu.rules"></button>
    </div>
  </div>
</main>

<main id="game" class="game" hidden>
  <header class="topbar">
    <button type="button" class="chip" id="btnMenu" data-t="game.menu"></button>
    <span class="topbar-title" id="topTitle"></span>
    <button type="button" class="chip" id="btnRules" data-t="menu.rules"></button>
    <button type="button" class="chip chip-icon" id="btnAbout" data-t-aria="about"><span data-art="info"></span></button>
    <button type="button" class="chip chip-icon" id="btnSound" aria-pressed="true"></button>
  </header>

  <div class="team blue" id="teamBlue">
    <span class="team-dot" aria-hidden="true"></span>
    <span class="clock" id="clockBlue" role="timer" hidden></span>
    <span class="team-name" data-t="team.blue"></span>
    <span class="team-who" id="whoBlue"></span>
    <span class="team-turn" data-t="team.turn"></span>
    <span class="den" id="denBlue" role="group" data-t-aria="den.blue"></span>
  </div>

  <div class="board-wrap">
    <div class="board-frame">
      <div class="board" id="board">
        <div class="pieces" id="pieces"></div>
      </div>
    </div>
  </div>

  <div class="team red" id="teamRed">
    <span class="team-dot" aria-hidden="true"></span>
    <span class="clock" id="clockRed" role="timer" hidden></span>
    <span class="team-name" data-t="team.red"></span>
    <span class="team-who" id="whoRed"></span>
    <span class="team-turn" data-t="team.turn"></span>
    <span class="den" id="denRed" role="group" data-t-aria="den.red"></span>
  </div>

  <div class="controls">
    <button type="button" class="die" id="die" data-t-aria="die"><span class="die-face" id="dieFace"></span></button>
    <div class="talk">
      <p class="message" id="message" role="status" aria-live="polite"></p>
      <div class="actions">
        <span class="steps" id="steps" aria-hidden="true"></span>
        <button type="button" class="btn btn-small" id="btnDone" data-t="done" hidden></button>
      </div>
    </div>
  </div>
</main>

<div id="rules" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="rulesTitle">
  <div class="card rules-card">
    <h2 id="rulesTitle" data-t="rules.title"></h2>
    <p class="rules-map" id="rulesMap"></p>
    <!-- Map 1 «Солнечная поляна» -->
    <div class="rules-body" data-rules="1">
      <h3 data-t="rules.h.win"></h3>
      <ul class="rules-list">
        <li><span class="r-ico" data-art="lion"></span><div data-t-html="rules.lion.html"></div></li>
        <li><span class="r-ico" data-art="hare"></span><div data-t-html="rules.hare.html"></div></li>
      </ul>

      <h3 data-t="rules.h.die"></h3>
      <p data-t="rules.die"></p>
      <ul class="rules-list">
        <li><span class="r-ico r-die" data-art="carrot"></span><div data-t-html="rules.carrot.html"></div></li>
        <li><span class="r-ico r-die" data-art="tree"></span><div data-t-html="rules.tree.html"></div></li>
        <li><span class="r-ico r-die" data-art="star"></span><div data-t-html="rules.stars.html"></div></li>
        <li><span class="r-ico r-die"></span><div data-t-html="rules.empty.html"></div></li>
      </ul>
      <p class="rules-timer" data-t="rules.timer"></p>

      <h3 data-t="rules.h.moves"></h3>
      <p data-t="rules.oneStep"></p>
      <ul class="rules-list">
        <li><span class="r-ico" data-art="lion"></span><div data-t-html="rules.m.lion.html"></div></li>
        <li><span class="r-ico" data-art="hare"></span><div data-t-html="rules.m.hare.html"></div></li>
        <li><span class="r-ico" data-art="squirrel"></span><div data-t-html="rules.m.squirrel.html"></div></li>
        <li><span class="r-ico" data-art="fox"></span><div data-t-html="rules.m.fox.html"></div></li>
        <li><span class="r-ico" data-art="lynx"></span><div data-t-html="rules.m.lynx.html"></div></li>
      </ul>

      <h3 data-t="rules.h.hunt"></h3>
      <ul class="rules-plain">
        <li data-t="rules.hunt1"></li>
        <li data-t="rules.hunt2"></li>
        <li data-t="rules.hunt3"></li>
        <li data-t="rules.hunt4"></li>
      </ul>
    </div>
    <!-- Map 2 «Глубокий лес»: the author's texts for the Panther, the Bear, the trap and the Carrot / Fish face -->
    <div class="rules-body" data-rules="2" hidden>
      <h3 data-t="rules.h.win"></h3>
      <ul class="rules-list">
        <li><span class="r-ico" data-art="lion"></span><div data-t-html="rules.lion.html"></div></li>
        <li><span class="r-ico" data-art="hare"></span><div data-t-html="rules.hare.html"></div></li>
      </ul>

      <h3 data-t="rules.h.die"></h3>
      <p data-t="rules.die"></p>
      <ul class="rules-list">
        <li><span class="r-ico r-die" data-art="food"></span><div data-t-html="rules.food.html"></div></li>
        <li><span class="r-ico r-die" data-art="tree"></span><div data-t-html="rules.tree.html"></div></li>
        <li><span class="r-ico r-die" data-art="star"></span><div data-t-html="rules.stars.html"></div></li>
        <li><span class="r-ico r-die"></span><div data-t-html="rules.empty.html"></div></li>
      </ul>
      <p class="rules-timer" data-t="rules.timer"></p>

      <h3 data-t="rules.h.moves"></h3>
      <p data-t="rules.oneStep"></p>
      <ul class="rules-list">
        <li><span class="r-ico" data-art="lion"></span><div data-t-html="rules.m.lion.html"></div></li>
        <li><span class="r-ico" data-art="hare"></span><div data-t-html="rules.m.hare.html"></div></li>
        <li><span class="r-ico" data-art="squirrel"></span><div data-t-html="rules.m.squirrel.html"></div></li>
        <li><span class="r-ico" data-art="panther"></span><div data-t-html="rules.m.panther.html"></div></li>
        <li><span class="r-ico" data-art="bear"></span><div data-t-html="rules.m.bear.html"></div></li>
      </ul>
      <p class="rules-note" data-t="rules.run"></p>

      <h3 data-t="rules.h.cells"></h3>
      <ul class="rules-list">
        <li><span class="r-ico r-cell r-trap" data-art="trap"></span><div data-t-html="rules.trap.html"></div></li>
        <li><span class="r-ico r-cell r-water" data-art="water"></span><div data-t-html="rules.water.html"></div></li>
      </ul>

      <h3 data-t="rules.h.hunt"></h3>
      <ul class="rules-plain">
        <li data-t="rules.hunt1"></li>
        <li data-t="rules.hunt2"></li>
        <li data-t="rules.hunt3"></li>
        <li data-t="rules.hunt4"></li>
        <li data-t="rules.hunt5"></li>
        <li data-t="rules.hunt6"></li>
      </ul>
    </div>
    <button type="button" class="btn btn-green" id="btnRulesClose" data-t="rules.close"></button>
  </div>
</div>

<div id="quit" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="quitTitle">
  <div class="card small-card">
    <h2 id="quitTitle" data-t="quit.title"></h2>
    <p data-t="quit.text"></p>
    <div class="card-row">
      <button type="button" class="btn btn-green" id="btnQuitNo" data-t="quit.no"></button>
      <button type="button" class="btn btn-ghost" id="btnQuitYes" data-t="quit.yes"></button>
    </div>
  </div>
</div>

<div id="win" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="winTitle">
  <div class="confetti" id="confetti" aria-hidden="true"></div>
  <div class="card small-card win-card">
    <div class="win-art" id="winArt" aria-hidden="true"></div>
    <h2 id="winTitle"></h2>
    <p id="winText"></p>
    <p class="win-who" id="winWho"></p>
    <div class="card-row">
      <button type="button" class="btn btn-green" id="btnAgain" data-t="win.again"></button>
      <button type="button" class="btn btn-ghost" id="btnWinMenu" data-t="win.menu"></button>
    </div>
  </div>
</div>

<script src="engine.js"></script>
<script src="i18n.js"></script>
<script src="hyphen.js"></script>
<script src="ui.js"></script>
</body>
</html>
